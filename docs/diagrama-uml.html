<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Flyweight</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        svg { display: block; width: 1180px; max-width: 100%; height: auto; }
        .nome { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; fill: #2d3142; }
        .membro { font-family: Consolas, monospace; font-size: 12px; fill: #2d3142; }
        .tag { font-family: Consolas, monospace; font-size: 11px; text-anchor: middle; fill: #4f5d75; }
    </style>
</head>
<body>
<svg viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrama-uml-title diagrama-uml-desc">
    <title id="diagrama-uml-title">Diagrama de classes do padrão Flyweight</title>
    <desc id="diagrama-uml-desc">EstacaoMonitoramento compõe Sensor e usa TipoSensorFactory, que mantém os objetos TipoSensor compartilhados e referenciados por cada Sensor.</desc>
    <defs>
        <marker id="heranca" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,16 6,0 12" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="associacao" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#4f5d75"/></marker>
        <marker id="agregacao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="composicao" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 5,9 0,18 5,9 10" fill="#2d3142" stroke="#2d3142"/></marker>
    </defs>
    <rect width="1180" height="600" fill="#ffffff"/>

    <line x1="520" y1="90" x2="700" y2="90" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="526" y="68" width="16" height="16" fill="#ffffff"/><text x="528" y="80" class="membro">1</text>
    <rect x="672" y="68" width="16" height="16" fill="#ffffff"/><text x="674" y="80" class="membro">1</text>
    <rect x="575" y="95" width="70" height="17" fill="#ffffff"/><text x="610" y="108" class="tag">fabrica</text>
    <line x1="280" y1="220" x2="280" y2="360" stroke="#2d3142" marker-start="url(#composicao)"/>
    <rect x="288" y="338" width="40" height="16" fill="#ffffff"/><text x="290" y="350" class="membro">0..*</text>
    <line x1="920" y1="160" x2="920" y2="360" stroke="#2d3142" marker-start="url(#agregacao)"/>
    <rect x="928" y="338" width="40" height="16" fill="#ffffff"/><text x="930" y="350" class="membro">0..*</text>
    <line x1="520" y1="470" x2="700" y2="470" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <rect x="526" y="448" width="40" height="16" fill="#ffffff"/><text x="528" y="460" class="membro">0..*</text>
    <rect x="672" y="448" width="16" height="16" fill="#ffffff"/><text x="674" y="460" class="membro">1</text>
    <rect x="590" y="475" width="40" height="17" fill="#ffffff"/><text x="610" y="488" class="tag">tipo</text>

    <g id="estacao">
        <rect x="40" y="40" width="480" height="180" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 40 H514 Q520 40 520 46 V76 H40 V46 Q40 40 46 40" fill="#f1f3f5"/>
        <text x="280" y="63" class="nome">EstacaoMonitoramento</text>
        <line x1="40" y1="76" x2="520" y2="76" stroke="#bfc0c0"/>
        <text x="54" y="96" class="membro">- fabrica: TipoSensorFactory {readOnly}</text>
        <text x="54" y="116" class="membro">- sensores: List&lt;Sensor&gt; {readOnly}</text>
        <line x1="40" y1="128" x2="520" y2="128" stroke="#bfc0c0"/>
        <text x="54" y="148" class="membro">+ instalar(String, double, String, String, String): Sensor</text>
        <text x="54" y="168" class="membro">+ gerarRelatorio(): List&lt;String&gt;</text>
        <text x="54" y="188" class="membro">+ getTotalSensores(): int</text>
        <text x="54" y="208" class="membro">+ getTotalTipos(): int</text>
    </g>
    <g id="tipo-sensor-factory">
        <rect x="700" y="40" width="440" height="120" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M706 40 H1134 Q1140 40 1140 46 V76 H700 V46 Q700 40 706 40" fill="#f1f3f5"/>
        <text x="920" y="63" class="nome">TipoSensorFactory</text>
        <line x1="700" y1="76" x2="1140" y2="76" stroke="#bfc0c0"/>
        <text x="714" y="96" class="membro">- tipos: Map&lt;String, TipoSensor&gt; {readOnly}</text>
        <line x1="700" y1="108" x2="1140" y2="108" stroke="#bfc0c0"/>
        <text x="714" y="128" class="membro">+ getTipoSensor(String, String, String): TipoSensor</text>
        <text x="714" y="148" class="membro">+ getTotalTipos(): int</text>
    </g>
    <g id="sensor">
        <rect x="40" y="360" width="480" height="160" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 360 H514 Q520 360 520 366 V396 H40 V366 Q40 360 46 360" fill="#f1f3f5"/>
        <text x="280" y="383" class="nome">Sensor</text>
        <line x1="40" y1="396" x2="520" y2="396" stroke="#bfc0c0"/>
        <text x="54" y="416" class="membro">- local: String {readOnly}</text>
        <text x="54" y="436" class="membro">- leitura: double {readOnly}</text>
        <text x="54" y="456" class="membro">- tipo: TipoSensor {readOnly}</text>
        <line x1="40" y1="468" x2="520" y2="468" stroke="#bfc0c0"/>
        <text x="54" y="488" class="membro">+ getTipo(): TipoSensor</text>
        <text x="54" y="508" class="membro">+ descrever(): String</text>
    </g>
    <g id="tipo-sensor">
        <rect x="700" y="360" width="440" height="200" rx="6" fill="#ffffff" stroke="#eb6c36"/>
        <rect x="700" y="360" width="440" height="200" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <path d="M706 360 H1134 Q1140 360 1140 366 V396 H700 V366 Q700 360 706 360" fill="#fff1eb"/>
        <text x="920" y="383" class="nome">TipoSensor</text>
        <line x1="700" y1="396" x2="1140" y2="396" stroke="#bfc0c0"/>
        <text x="714" y="416" class="membro">- modelo: String {readOnly}</text>
        <text x="714" y="436" class="membro">- unidade: String {readOnly}</text>
        <text x="714" y="456" class="membro">- fabricante: String {readOnly}</text>
        <line x1="700" y1="468" x2="1140" y2="468" stroke="#bfc0c0"/>
        <text x="714" y="488" class="membro">+ getModelo(): String</text>
        <text x="714" y="508" class="membro">+ getUnidade(): String</text>
        <text x="714" y="528" class="membro">+ getFabricante(): String</text>
        <text x="714" y="548" class="membro">+ formatarLeitura(double): String</text>
    </g>
</svg>
</body>
</html>
